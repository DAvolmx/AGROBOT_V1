# Nav2 para AgroBot — robot DIFERENCIAL (skid-steer) lento (~0.3-0.5 m/s),
# LIDAR 2D, sin encoders. Tuning 2026-09-19.
#
# CAMBIOS PRINCIPALES respecto a la versión anterior:
#   - RotationShimController envuelve a DWB: el robot gira primero para
#     mirar adonde va, luego avanza. Un diferencial que arranca con el
#     rumbo equivocado pierde tiempo curvando o DWB le ordena retroceder.
#   - Escalas explícitas en los críticos de DWB: sin ellas todos pesan
#     igual y el planner no prioriza la seguridad sobre la velocidad.
#   - Costmap: mayor alcance de raytrace para limpiar celdas detrás de
#     obstáculos que desaparecieron (puerta que se abre, persona que pasa).
#   - Progress checker más permisivo para un skid-steer que arranca lento.

# HUELLA DEL ROBOT: 0.40 m × 0.35 m centrado en base_link.
# Cambiar aquí Y en agrobot_config.json sección slam.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # El skid-steer arranca lento (patinaje) y rf2o tarda ~1 s en
      # detectar el avance: un umbral pequeño con tiempo ajustado evita
      # abortos falsos sin dejar pasar bloqueos reales.
      required_movement_radius: 0.08
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      # RotationShimController: gira primero hasta mirar la ruta, luego
      # cede a DWB. Para un diferencial es un salto grande en calidad de
      # trayectoria porque DWB genera curvas que un skid-steer no puede
      # ejecutar bien cuando arranca mirando al revés.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.6
      simulate_ahead_time: 1.0

      # ---- DWB (controlador principal) ----
      min_vel_x: -0.2
      max_vel_x: 0.4
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -1.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 25
      vy_samples: 1
      vtheta_samples: 35
      sim_time: 2.0

      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Escalas: cuánto pesa cada criterio en la puntuación final.
      ObstacleFootprint.scale: 32.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.x_only_threshold: 0.05

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      width: 5
      height: 5
      resolution: 0.05
      rolling_window: true
      footprint: "[[0.20, 0.185], [0.20, -0.185], [-0.20, -0.185], [-0.20, 0.185]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          inf_is_valid: true
          max_obstacle_height: 2.0
          # Retornos del propio robot (mástil a 15 cm, cable a 8 cm).
          obstacle_min_range: 0.18
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.5
      publish_frequency: 1.0
      resolution: 0.05
      footprint: "[[0.20, 0.185], [0.20, -0.185], [-0.20, -0.185], [-0.20, 0.185]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          inf_is_valid: true
          max_obstacle_height: 2.0
          # Retornos del propio robot (mástil a 15 cm, cable a 8 cm).
          obstacle_min_range: 0.18
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
