# Modo MAPEO — se usa la primera vez que el robot recorre un terreno nuevo.
# El operador mueve el robot (manual, desde el dashboard) mientras esto
# construye el mapa de ocupación en vivo. Cuando termina, se guarda con
# POST /api/nav/save_map (jetson_server.py llama a nav2_map_server/map_saver_cli).
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.3
    transform_publish_period: 0.05
    map_update_interval: 2.0
    scan_buffer_size: 10

    # Umbrales de movimiento minimo para añadir un nodo al grafo de poses.
    #
    # Estaban SIN poner, y aqui importa mas de lo que parece. La pose viene de
    # un EKF que integra el giroscopio y, a falta de una medida real de
    # traslacion, DERIVA aunque el robot este quieto. Cada trozo de deriva que
    # supera el umbral crea un nodo nuevo y el grafo no para de crecer: el
    # 2026-09-06, con el robot inmovil sobre la mesa, slam_toolbox llego a
    # 1768 MB y subiendo, camino de su tope.
    #
    # 0.3 m y 0.3 rad son conservadores para un robot de este tamaño: bastante
    # mayores que la deriva por ruido, y bastante menores que la separacion
    # entre surcos.
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
