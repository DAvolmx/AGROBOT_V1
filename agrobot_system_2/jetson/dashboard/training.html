<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroBot — Entrenamiento</title>
<style>
:root {
  --bg: #1a1f2e;
  --card: #232838;
  --card-hover: #2a3048;
  --ink: #e0e4ef;
  --ink-soft: #8b95b0;
  --accent: #00bd4f;
  --accent-ink: #6ef5a0;
  --accent-soft: rgba(0,189,79,0.15);
  --warn: #f5a623;
  --crit: #e74c3c;
  --line: #2f3650;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: 48px 1fr;
  height: 100vh;
  overflow: hidden;
}
.mono { font-family: "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric: tabular-nums; }

/* --- Header --- */
header {
  grid-column: 1/-1;
  background: var(--card);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  z-index: 10;
}
header h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
header .pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--ink-soft);
}
header .pill .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--crit);
}
header .pill.ok .dot { background: var(--accent); }
.toolbar {
  display: flex; gap: 6px; margin-left: auto;
}
.toolbar button {
  background: var(--card-hover); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.toolbar button:hover { border-color: var(--accent); color: var(--accent-ink); }
.toolbar button.active {
  background: var(--accent-soft); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 600;
}
.toolbar .sep { width:1px; background: var(--line); margin: 4px 2px; }

/* --- Map panel --- */
#map-panel {
  position: relative;
  overflow: hidden;
  background: #10131d;
}
#map-canvas {
  width: 100%; height: 100%;
  display: block;
  cursor: crosshair;
}
#map-info {
  position: absolute; top: 8px; left: 8px;
  background: rgba(26,31,46,0.85);
  padding: 4px 10px; border-radius: 6px;
  font-size: 11px; color: var(--ink-soft);
}
#pose-info {
  position: absolute; bottom: 8px; left: 8px;
  background: rgba(26,31,46,0.85);
  padding: 4px 10px; border-radius: 6px;
  font-size: 12px; color: var(--accent-ink);
}
#tool-hint {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,189,79,0.12);
  border: 1px solid var(--accent);
  padding: 4px 10px; border-radius: 6px;
  font-size: 11px; color: var(--accent-ink);
}

/* --- Sidebar --- */
#sidebar {
  background: var(--card);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.side-section {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.side-section h3 {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 0.5px;
}

/* --- Drive controls --- */
.drive-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  max-width: 200px;
  margin: 0 auto;
}
.drive-btn {
  background: var(--card-hover);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-size: 18px;
  padding: 10px;
  cursor: pointer;
  user-select: none;
  font-family: inherit;
}
.drive-btn:hover { border-color: var(--accent); }
.drive-btn:active { background: var(--accent-soft); }
.mode-btn { background: var(--card-hover); border: 1px solid var(--line); border-radius: 6px; color: var(--ink-soft); padding: 4px 14px; font-size: 12px; cursor: pointer; font-family: inherit; flex:1; }
.mode-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.mode-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.drive-btn.stop { background: rgba(231,76,60,0.2); border-color: var(--crit); color: var(--crit); }
.drive-btn.stop:active { background: rgba(231,76,60,0.4); }

/* --- Config section --- */
.config-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.config-row label {
  font-size: 11px; color: var(--ink-soft);
  min-width: 90px;
}
.config-row input, .config-row select {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; color: var(--ink);
  padding: 3px 6px; font-size: 12px;
  width: 100%;
  font-family: inherit;
}
.config-row input:focus, .config-row select:focus {
  border-color: var(--accent); outline: none;
}
.btn-primary {
  background: var(--accent); color: #111;
  border: none; border-radius: 6px;
  padding: 6px 14px; font-weight: 600;
  cursor: pointer; font-size: 12px;
  font-family: inherit; width: 100%;
}
.btn-primary:hover { filter: brightness(1.15); }
.btn-secondary {
  background: var(--card-hover); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 14px; cursor: pointer; font-size: 12px;
  font-family: inherit; width: 100%;
}
.btn-secondary:hover { border-color: var(--accent); }

.btn-row { display: flex; gap: 6px; margin-top: 6px; }
.btn-row > * { flex:1; }

/* --- Furrows list --- */
.furrow-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0; font-size: 12px;
}
.furrow-item .del { color: var(--crit); cursor: pointer; background:none; border:none; font-size:14px; }

/* --- Scan points list --- */
.scan-item {
  font-size: 12px; padding: 3px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.scan-item .del { color: var(--crit); cursor: pointer; background:none; border:none; font-size:14px; }

/* --- Toast --- */
#toast {
  position: fixed; top: 58px; right: 340px;
  background: var(--card); border: 1px solid var(--accent);
  color: var(--accent-ink); padding: 8px 16px;
  border-radius: 8px; font-size: 13px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  z-index: 99;
}
#toast.show { opacity: 1; pointer-events: auto; }

/* --- Mobile --- */
@media (max-width: 768px) {
  body { grid-template-columns: 1fr; grid-template-rows: 48px 50vh 1fr; }
  #sidebar { border-left: none; border-top: 1px solid var(--line); }
  #toast { right: 8px; }
}
</style>
</head>
<body>

<header>
  <h1>AgroBot Entrenamiento</h1>
  <span id="ws-pill" class="pill"><span class="dot"></span><span id="ws-text">Desconectado</span></span>
  <span id="pose-pill" class="pill mono" style="font-size:11px">—</span>
  <div class="toolbar">
    <button id="tool-select" class="active" onclick="setTool('select')">☝ Seleccionar</button>
    <button id="tool-pose" onclick="setTool('pose')">📍 Corregir pose</button>
    <div class="sep"></div>
    <button id="tool-furrow" onclick="setTool('furrow')">〰 Dibujar surco</button>
    <button id="tool-scan" onclick="setTool('scan')">🌱 Punto escaneo</button>
    <div class="sep"></div>
    <button id="tool-goal" onclick="setTool('goal')">🎯 Meta Nav2</button>
  </div>
</header>

<div id="map-panel">
  <canvas id="map-canvas"></canvas>
  <div id="map-info">Esperando mapa…</div>
  <div id="pose-info" class="mono">—</div>
  <div id="tool-hint">Herramienta: Seleccionar</div>
</div>

<div id="sidebar">
  <!-- Drive -->
  <div class="side-section">
    <h3>Manejo manual</h3>
    <div style="display:flex; gap:4px; margin-bottom:8px;">
      <button class="mode-btn" id="tmode-interior" onclick="setDriveMode('interior')">Interior</button>
      <button class="mode-btn active" id="tmode-exterior" onclick="setDriveMode('exterior')">Exterior</button>
    </div>
    <div class="drive-grid">
      <div></div>
      <button class="drive-btn" onpointerdown="driveStart('adelante')" onpointerup="driveStop()" onpointerleave="driveStop()">▲</button>
      <div></div>
      <button class="drive-btn" onpointerdown="driveStart('izquierda')" onpointerup="driveStop()" onpointerleave="driveStop()">◀</button>
      <button class="drive-btn stop" onpointerdown="driveStop()">■</button>
      <button class="drive-btn" onpointerdown="driveStart('derecha')" onpointerup="driveStop()" onpointerleave="driveStop()">▶</button>
      <div></div>
      <button class="drive-btn" onpointerdown="driveStart('atras')" onpointerup="driveStop()" onpointerleave="driveStop()">▼</button>
      <div></div>
    </div>
    <div class="config-row" style="margin-top:8px">
      <label>Velocidad</label>
      <input type="range" id="drive-scale" min="0.1" max="1" step="0.05" value="0.4">
      <span id="drive-scale-val" class="mono" style="font-size:11px;min-width:30px">0.4</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
      <label style="font-size:11px; color:var(--ink-soft);">Maniobra</label>
      <input type="checkbox" id="maniobra-toggle" checked>
      <span id="mode-hint" style="font-size:10px; color:var(--ink-soft);">arco corto</span>
    </div>
  </div>

  <!-- Surcos -->
  <div class="side-section">
    <h3>Surcos / Filas</h3>
    <div id="furrow-list"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="clearFurrows()">Borrar todos</button>
      <button class="btn-primary" onclick="saveFurrows()">Guardar</button>
    </div>
  </div>

  <!-- Puntos escaneo -->
  <div class="side-section">
    <h3>Puntos de escaneo 🌱</h3>
    <div id="scan-list"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="clearScanPoints()">Borrar todos</button>
      <button class="btn-primary" onclick="saveScanPoints()">Guardar</button>
    </div>
  </div>

  <!-- Generar ruta -->
  <div class="side-section">
    <h3>Generar ruta</h3>
    <div class="config-row">
      <label>Espaciado (m)</label>
      <input type="number" id="route-spacing" value="0.5" min="0.1" max="5" step="0.1">
    </div>
    <button class="btn-primary" onclick="generateRoute()">Generar waypoints</button>
    <div id="route-info" style="font-size:11px; color:var(--ink-soft); margin-top:4px"></div>
  </div>

  <!-- Config conos -->
  <div class="side-section">
    <h3>Configuración de conos</h3>
    <div class="config-row"><label>Cono frontal (°)</label><input type="number" id="cfg-cono-frontal" value="20"></div>
    <div class="config-row"><label>Cono lateral (°)</label><input type="number" id="cfg-cono-lateral" value="60"></div>
    <div class="config-row"><label>Margen parada (cm)</label><input type="number" id="cfg-margen" value="10"></div>
    <div class="config-row"><label>Deslizamiento (cm)</label><input type="number" id="cfg-desliz" value="40"></div>
    <div class="config-row"><label>Vel. máx (m/s)</label><input type="number" id="cfg-vel" value="0.55" step="0.05"></div>
    <div class="config-row"><label>Omega máx (r/s)</label><input type="number" id="cfg-omega" value="1.9" step="0.1"></div>
    <button class="btn-primary" onclick="saveConfig()">Aplicar config</button>
  </div>

  <!-- Mapa -->
  <div class="side-section">
    <h3>Mapa</h3>
    <div class="config-row"><label>Nombre</label><input type="text" id="map-name" value="campo_01"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="loadMap()">Cargar</button>
      <button class="btn-primary" onclick="saveMap()">Guardar mapa</button>
    </div>
    <div id="map-list" style="margin-top:6px; font-size:11px; color:var(--ink-soft)"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const API = `http://${location.host}`;

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let ws = null;
let lastMap = null;
let lastPose = { x: 0, y: 0, theta_deg: 0 };
let currentTool = "select";
let furrows = [];
let currentFurrow = null;
let scanPoints = [];
let generatedWaypoints = [];
let isDriving = false;

const canvas = $("map-canvas");
const ctx = canvas.getContext("2d");

// ---------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    $("ws-pill").classList.add("ok");
    $("ws-text").textContent = "Conectado";
    loadTrainingData();
    loadMapList();
    loadConfig();
  };
  ws.onclose = () => {
    $("ws-pill").classList.remove("ok");
    $("ws-text").textContent = "Desconectado";
    setTimeout(connectWS, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case "status":
        if (msg.data.pose) updatePose(msg.data.pose);
        if (msg.data.map) setMap(msg.data.map);
        break;
      case "pose": updatePose(msg.data); break;
      case "map": setMap(msg.data); break;
      case "toast": showToast(msg.data.message, msg.data.kind); break;
    }
  };
}

function updatePose(p) {
  if (!p) return;
  lastPose = p;
  $("pose-info").textContent = `x=${p.x.toFixed(2)}  y=${p.y.toFixed(2)}  θ=${(p.theta_deg||0).toFixed(0)}°`;
  $("pose-pill").textContent = `${p.x.toFixed(2)}, ${p.y.toFixed(2)}`;
  drawMap();
}

function setMap(m) {
  lastMap = m;
  $("map-info").textContent = `${m.width}×${m.height} · ${m.resolution.toFixed(2)} m/celda`;
  drawMap();
}

// ---------------------------------------------------------------
// Map rendering
// ---------------------------------------------------------------
function resizeCanvas() {
  const r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width;
  canvas.height = r.height;
  drawMap();
}

function worldToPixel(wx, wy) {
  if (!lastMap) return [0, 0];
  const { width: gw, height: gh, resolution: res, origin_x: ox, origin_y: oy } = lastMap;
  const w = canvas.width, h = canvas.height;
  const scale = Math.min(w / gw, h / gh);
  const offx = (w - gw * scale) / 2, offy = (h - gh * scale) / 2;
  return [
    offx + ((wx - ox) / res) * scale,
    h - (offy + ((wy - oy) / res) * scale),
  ];
}

function pixelToWorld(px, py) {
  if (!lastMap) return [0, 0];
  const { width: gw, height: gh, resolution: res, origin_x: ox, origin_y: oy } = lastMap;
  const w = canvas.width, h = canvas.height;
  const scale = Math.min(w / gw, h / gh);
  const offx = (w - gw * scale) / 2, offy = (h - gh * scale) / 2;
  return [
    ((px - offx) / scale) * res + ox,
    ((h - py - offy) / scale) * res + oy,
  ];
}

function drawMap() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!lastMap) return;

  const { width: gw, height: gh, data } = lastMap;
  const scale = Math.min(w / gw, h / gh);
  const offx = (w - gw * scale) / 2, offy = (h - gh * scale) / 2;

  // Occupancy grid
  for (let row = 0; row < gh; row++) {
    for (let col = 0; col < gw; col++) {
      const v = data[row * gw + col];
      if (v < 0) continue;
      ctx.fillStyle = v > 50 ? "#2f4038" : "#c8d8cf";
      ctx.fillRect(offx + col * scale, offy + (gh - 1 - row) * scale, scale + 0.5, scale + 0.5);
    }
  }

  // Grid lines (light)
  if (scale > 4) {
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 0.5;
    for (let x = offx; x < offx + gw * scale; x += scale * 10) {
      ctx.beginPath(); ctx.moveTo(x, offy); ctx.lineTo(x, offy + gh * scale); ctx.stroke();
    }
    for (let y = offy; y < offy + gh * scale; y += scale * 10) {
      ctx.beginPath(); ctx.moveTo(offx, y); ctx.lineTo(offx + gw * scale, y); ctx.stroke();
    }
  }

  // Saved furrows
  furrows.forEach((f, fi) => {
    if (f.points.length < 2) return;
    ctx.strokeStyle = "rgba(245,166,35,0.7)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 3]);
    ctx.beginPath();
    f.points.forEach((p, i) => {
      const [px, py] = worldToPixel(p.x, p.y);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    // Label
    const [lx, ly] = worldToPixel(f.points[0].x, f.points[0].y);
    ctx.fillStyle = "#f5a623";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText(`S${fi + 1}`, lx + 4, ly - 4);
  });

  // Current furrow being drawn
  if (currentFurrow && currentFurrow.length > 0) {
    ctx.strokeStyle = "rgba(0,189,79,0.9)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    currentFurrow.forEach((p, i) => {
      const [px, py] = worldToPixel(p.x, p.y);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    currentFurrow.forEach(p => {
      const [px, py] = worldToPixel(p.x, p.y);
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fillStyle = "#00bd4f";
      ctx.fill();
    });
  }

  // Generated waypoints
  if (generatedWaypoints.length > 0) {
    ctx.strokeStyle = "rgba(100,180,255,0.5)";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    generatedWaypoints.forEach((wp, i) => {
      const [px, py] = worldToPixel(wp.x, wp.y);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    generatedWaypoints.forEach(wp => {
      const [px, py] = worldToPixel(wp.x, wp.y);
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = wp.scan ? "#ffdd00" : "#64b4ff";
      ctx.fill();
    });
  }

  // Scan points
  scanPoints.forEach(sp => {
    const [px, py] = worldToPixel(sp.x, sp.y);
    ctx.font = "18px serif";
    ctx.textAlign = "center";
    ctx.fillText("🌱", px, py + 6);
    ctx.textAlign = "left";
  });

  // Robot pose
  if (lastPose) {
    const [px, py] = worldToPixel(lastPose.x, lastPose.y);
    const th = (-lastPose.theta_deg) * Math.PI / 180;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(th);
    ctx.fillStyle = "#00bd4f";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(-7, 8);
    ctx.lineTo(7, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

// ---------------------------------------------------------------
// Tools
// ---------------------------------------------------------------
const toolHints = {
  select: "Seleccionar",
  pose: "Clic en el mapa para corregir la pose del robot",
  furrow: "Clic para agregar puntos al surco, doble clic para terminar",
  scan: "Clic para colocar un punto de escaneo 🌱",
  goal: "Clic para enviar una meta de navegación a Nav2",
};

function setTool(t) {
  currentTool = t;
  document.querySelectorAll(".toolbar button").forEach(b => b.classList.remove("active"));
  const btn = $(`tool-${t}`);
  if (btn) btn.classList.add("active");
  $("tool-hint").textContent = `Herramienta: ${toolHints[t] || t}`;
  canvas.style.cursor = t === "select" ? "default" : "crosshair";
  if (t !== "furrow" && currentFurrow && currentFurrow.length >= 2) {
    finishFurrow();
  }
}

// ---------------------------------------------------------------
// Canvas events
// ---------------------------------------------------------------
canvas.addEventListener("click", e => {
  if (!lastMap) return;
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const [wx, wy] = pixelToWorld(px, py);

  switch (currentTool) {
    case "pose":
      correctPose(wx, wy);
      break;
    case "furrow":
      if (!currentFurrow) currentFurrow = [];
      currentFurrow.push({ x: wx, y: wy });
      drawMap();
      break;
    case "scan":
      scanPoints.push({ x: wx, y: wy });
      updateScanList();
      drawMap();
      break;
    case "goal":
      sendNavGoal(wx, wy);
      break;
  }
});

canvas.addEventListener("dblclick", e => {
  if (currentTool === "furrow" && currentFurrow && currentFurrow.length >= 2) {
    e.preventDefault();
    finishFurrow();
  }
});

// Keyboard
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  switch (e.key) {
    case "1": setTool("select"); break;
    case "2": setTool("pose"); break;
    case "3": setTool("furrow"); break;
    case "4": setTool("scan"); break;
    case "5": setTool("goal"); break;
    case "Escape":
      if (currentFurrow) { currentFurrow = null; drawMap(); }
      setTool("select");
      break;
    case "w": case "ArrowUp": driveStart("adelante"); break;
    case "s": case "ArrowDown": driveStart("atras"); break;
    case "a": case "ArrowLeft": driveStart("izquierda"); break;
    case "d": case "ArrowRight": driveStart("derecha"); break;
    case " ": driveStop(); e.preventDefault(); break;
  }
});
document.addEventListener("keyup", e => {
  if (["w","a","s","d","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
    driveStop();
  }
});

// ---------------------------------------------------------------
// API calls
// ---------------------------------------------------------------
async function apiPost(url, body) {
  try {
    const r = await fetch(API + url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return await r.json();
  } catch (e) {
    showToast("Error de red: " + e.message, "error");
    return { error: e.message };
  }
}

async function apiGet(url) {
  try {
    const r = await fetch(API + url);
    return await r.json();
  } catch (e) {
    return { error: e.message };
  }
}

// --- Drive ---
let driveMode = "exterior";
let maniobra = true;

function setDriveMode(modo) {
  driveMode = modo;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
  const el = $("tmode-" + modo);
  if (el) el.classList.add("active");
  if (modo === "interior") {
    maniobra = false;
    $("maniobra-toggle").checked = false;
    $("mode-hint").textContent = "giro en su eje";
  } else {
    maniobra = true;
    $("maniobra-toggle").checked = true;
    $("mode-hint").textContent = "arco corto";
  }
  apiPost("/api/drive/mode", { modo });
}
$("maniobra-toggle").addEventListener("change", e => {
  maniobra = e.target.checked;
  $("mode-hint").textContent = maniobra ? "arco corto" : "giro en su eje";
});

function driveStart(accion) {
  if (isDriving) return;
  isDriving = true;
  const escala = parseFloat($("drive-scale").value);
  apiPost("/api/drive", { accion, escala, maniobra });
  apiPost("/api/training/log_correction", { type: "drive", vx: accion === "adelante" ? escala : (accion === "atras" ? -escala : 0), omega: accion === "izquierda" ? escala : (accion === "derecha" ? -escala : 0) });
}
function driveStop() {
  if (!isDriving) return;
  isDriving = false;
  apiPost("/api/drive", { accion: "parar" });
}
$("drive-scale").addEventListener("input", e => {
  $("drive-scale-val").textContent = parseFloat(e.target.value).toFixed(2);
});

// --- Pose correction ---
async function correctPose(wx, wy) {
  const theta = lastPose.theta_deg || 0;
  await apiPost("/api/training/correct_pose", { x: wx, y: wy, theta_deg: theta });
}

// --- Furrows ---
function finishFurrow() {
  if (currentFurrow && currentFurrow.length >= 2) {
    furrows.push({ points: currentFurrow });
  }
  currentFurrow = null;
  updateFurrowList();
  drawMap();
}

function updateFurrowList() {
  const el = $("furrow-list");
  el.innerHTML = furrows.map((f, i) =>
    `<div class="furrow-item"><span>Surco ${i + 1} — ${f.points.length} pts</span><button class="del" onclick="deleteFurrow(${i})">✕</button></div>`
  ).join("");
}

function deleteFurrow(i) {
  furrows.splice(i, 1);
  updateFurrowList();
  drawMap();
}

function clearFurrows() {
  furrows = [];
  currentFurrow = null;
  generatedWaypoints = [];
  updateFurrowList();
  drawMap();
}

async function saveFurrows() {
  await apiPost("/api/training/save_furrows", { furrows });
  showToast(`${furrows.length} surco(s) guardados`, "success");
}

// --- Scan points ---
function updateScanList() {
  const el = $("scan-list");
  el.innerHTML = scanPoints.map((sp, i) =>
    `<div class="scan-item"><span>🌱 (${sp.x.toFixed(2)}, ${sp.y.toFixed(2)})</span><button class="del" onclick="deleteScanPoint(${i})">✕</button></div>`
  ).join("");
}

function deleteScanPoint(i) {
  scanPoints.splice(i, 1);
  updateScanList();
  drawMap();
}

function clearScanPoints() {
  scanPoints = [];
  updateScanList();
  drawMap();
}

async function saveScanPoints() {
  await apiPost("/api/training/save_scan_points", { scan_points: scanPoints });
  showToast(`${scanPoints.length} punto(s) de escaneo guardados`, "success");
}

// --- Route generation ---
async function generateRoute() {
  const spacing = parseFloat($("route-spacing").value) || 0.5;
  const res = await apiPost("/api/training/generate_route", {
    furrows, scan_points: scanPoints, spacing_m: spacing
  });
  if (res.ok) {
    generatedWaypoints = res.waypoints || [];
    $("route-info").textContent = `${res.count} waypoints generados`;
    showToast(`Ruta generada: ${res.count} waypoints`, "success");
    drawMap();
  }
}

// --- Nav goal ---
async function sendNavGoal(wx, wy) {
  await apiPost("/api/nav/set_goal", { x: wx, y: wy, theta_deg: 0 });
}

// --- Config ---
async function loadConfig() {
  const cfg = await apiGet("/api/params");
  if (cfg.error) return;
  if (cfg.slam) {
    $("cfg-cono-frontal").value = cfg.slam.cono_frontal_deg || 20;
    $("cfg-cono-lateral").value = cfg.slam.cono_lateral_deg || 60;
    $("cfg-margen").value = cfg.slam.margen_parada_cm || 10;
    $("cfg-desliz").value = cfg.slam.deslizamiento_cm || 40;
  }
  if (cfg.control) {
    $("cfg-vel").value = cfg.control.max_v_mps || 0.55;
    $("cfg-omega").value = cfg.control.max_omega_rps || 1.9;
  }
}

async function saveConfig() {
  await apiPost("/api/params/slam", {
    cono_frontal_deg: parseInt($("cfg-cono-frontal").value),
    cono_lateral_deg: parseInt($("cfg-cono-lateral").value),
    margen_parada_cm: parseInt($("cfg-margen").value),
    deslizamiento_cm: parseInt($("cfg-desliz").value),
  });
  await apiPost("/api/params/control", {
    max_v_mps: parseFloat($("cfg-vel").value),
    max_omega_rps: parseFloat($("cfg-omega").value),
  });
  showToast("Configuración aplicada", "success");
}

// --- Map save/load ---
async function loadMapList() {
  const res = await apiGet("/api/mapas");
  if (res.mapas) {
    $("map-list").textContent = `Mapas: ${res.mapas.map(m => m.nombre || m).join(", ") || "ninguno"}`;
  }
}

async function saveMap() {
  const nombre = $("map-name").value.trim();
  if (!nombre) return showToast("Escribe un nombre para el mapa", "error");
  await apiPost("/api/mapas/guardar", { nombre, sobrescribir: true });
  loadMapList();
}

async function loadMap() {
  const nombre = $("map-name").value.trim();
  if (!nombre) return showToast("Escribe el nombre del mapa a cargar", "error");
  await apiPost("/api/mapas/cargar", { nombre });
}

// --- Training data ---
async function loadTrainingData() {
  const res = await apiGet("/api/training/data");
  if (res.error) return;
  furrows = res.furrows || [];
  scanPoints = res.scan_points || [];
  updateFurrowList();
  updateScanList();
  drawMap();
}

// ---------------------------------------------------------------
// Toast
// ---------------------------------------------------------------
let toastTimer = null;
function showToast(msg, kind) {
  const el = $("toast");
  el.textContent = msg;
  el.style.borderColor = kind === "error" ? "var(--crit)" : kind === "success" ? "var(--accent)" : "var(--warn)";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}

// ---------------------------------------------------------------
// Init
// ---------------------------------------------------------------
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
connectWS();
</script>
</body>
</html>
