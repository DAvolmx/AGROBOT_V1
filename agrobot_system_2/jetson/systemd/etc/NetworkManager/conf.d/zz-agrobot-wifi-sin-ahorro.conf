# AgroBot: sin ahorro de energía en el WiFi de la Jetson.
# Se llama zz-* a propósito: NetworkManager lee conf.d en orden alfabético y
# el default-wifi-powersave-on.conf de Ubuntu (powersave = 3) pisaba a un
# 99-* ("9" va antes que "d").
# Con el ahorro activado la radio "duerme" entre beacons y el enlace con el
# router tenía picos de 1-2,7 s de latencia (medido el 2026-10-01). 2 = desactivado.
[connection]
wifi.powersave = 2
