# AgroBot — AP de la Jetson, en modo DUAL con el cliente Wi-Fi.
#
# El chip es un Intel 8265 (iwlwifi), que declara:
#   #{ managed } <= 1, #{ AP, P2P-client, P2P-GO } <= 1, total <= 3
# o sea: un cliente MÁS un AP a la vez. El AP corre sobre el vif virtual
# `ap0`, creado con `iw phy phy0 interface add ap0 type __ap`.
#
# ⚠️ EL CANAL DEBE SER EL MISMO QUE EL DEL CLIENTE. La radio es una sola:
# si se le piden dos canales tiene que repartirse el tiempo entre ambos, y
# en iwlwifi eso va de "lento e intermitente" a directamente no asociar.
# Si `LoRa_Wan` cambia de canal, hay que cambiar este también
# (`iw dev wlP1p1s0 info | grep channel`).
interface=ap0
driver=nl80211
ssid=JETSON_AP
hw_mode=g
channel=11
ieee80211n=1
wmm_enabled=1

# Potencia máxima TX (30 dBm = 1000 mW) para máximo alcance
tx_queue_data3_aifs=7
tx_queue_data3_cwmin=15
tx_queue_data3_cwmax=1023
tx_queue_data3_burst=0

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=12345678

# Los ESP32 son 2.4 GHz b/g/n: no se restringe a N puro ni se habilita PMF
# obligatorio, que algunos ESP32 con SDK viejo no negocian.
ieee80211w=0
