# Modo MAPEO — SLAM optimizado para AgroBot (RPLIDAR C1 + skid-steer).
#
# Tuning 2026-09-19: grafo más denso, cierre de bucles activo, correlación
# ampliada para compensar la odometría ruidosa de rf2o sin encoders.
# El scan llega prefiltrado (/scan_slam: rango 0.15–8 m + mediana espacial)
# para que el casamiento de scans opere sobre datos limpios.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam
    mode: mapping

    resolution: 0.05
    # 8 m en vez de 12: el RPLIDAR C1 es fiable hasta ~8 m en interiores;
    # más allá domina el multipath (rebotes de muros lejanos) que crea
    # fantasmas en el mapa.
    max_laser_range: 8.0
    minimum_time_interval: 0.1
    transform_publish_period: 0.02
    map_update_interval: 0.5
    tf_buffer_duration: 30.0
    transform_timeout: 0.2

    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 8.0

    # Umbrales de movimiento para añadir nodos al grafo.
    # Antes 0.3/0.3 — demasiado conservador para habitaciones pequeñas
    # donde el robot recorre pocos metros. Con el EKF estabilizado
    # (process_noise_covariance explícita, aceleración deshabilitada)
    # ya no hay riesgo de crear nodos espurios con el robot quieto.
    # 2026-10-26: el error por paso del SLAM era de 3 cm / 1° con keyframes cada 12 cm / 0,15 rad (el robot avanza ~7 cm por paso de 0,2 s): se corrige más seguido
    minimum_travel_distance: 0.06
    minimum_travel_heading: 0.08

    # ---- Casamiento de scans ----
    use_scan_matching: true
    use_scan_barycenter: true
    # Búsqueda de correlación: ventana de 0.6 m (default 0.5) para tolerar
    # el error de predicción de rf2o sobre un skid-steer sin encoders.
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.06

    # Casamiento fino: respuesta mínima baja para aceptar casamiento
    # en zonas con pocos features (habitaciones vacías, pasillos largos).
    link_match_minimum_response_fine: 0.08
    link_scan_maximum_distance: 2.0

    # Penalizaciones de varianza
    distance_variance_penalty: 0.3
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5

    # ---- Cierre de bucles ----
    # Crucial para corregir la deriva acumulada: cuando el robot vuelve a
    # pasar por un sitio ya mapeado, el solver reajusta todo el grafo.
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_search_maximum_distance: 4.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
