# DNSMASQ para AP JETSON_AP (192.168.12.1)
# Sirve DHCP, DNS y resolución local para el AP

# Interfaz
interface=ap0
listen-address=192.168.12.1

# DHCP (ESP32, teléfono, etc)
dhcp-range=192.168.12.50,192.168.12.200,12h
dhcp-lease-max=50

# DNS
address=/#/192.168.12.1
local=/agrobot.local/192.168.12.1

# No conflicto con otros dnsmasq
bind-interfaces
except-interface=lo

# Log
log-queries=extra
log-facility=/var/log/dnsmasq-ap.log
